<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đèn Kéo Quân</title>

<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(#111,#333);
        overflow:hidden;
    }

    .container{
        perspective:1000px;
    }

    .lantern{
        width:250px;
        height:300px;
        position:relative;
        transform-style:preserve-3d;
        animation:rotate 10s linear infinite;
    }

    .lantern:hover{
        animation-play-state: paused;
    }

    .lantern span{
        position:absolute;
        width:220px;
        height:280px;
        left:15px;
        top:10px;
        border:3px solid white;
        border-radius:10px;
        overflow:hidden;
        box-shadow:0 0 15px white;
    }

    .lantern span img{
        width:100%;
        height:100%;
        object-fit:cover;
    }

    .lantern span:nth-child(1){
        transform:rotateY(0deg) translateZ(250px);
    }

    .lantern span:nth-child(2){
        transform:rotateY(60deg) translateZ(250px);
    }

    .lantern span:nth-child(3){
        transform:rotateY(120deg) translateZ(250px);
    }

    .lantern span:nth-child(4){
        transform:rotateY(180deg) translateZ(250px);
    }

    .lantern span:nth-child(5){
        transform:rotateY(240deg) translateZ(250px);
    }

    .lantern span:nth-child(6){
        transform:rotateY(300deg) translateZ(250px);
    }

    @keyframes rotate{
        from{
            transform:rotateY(0deg);
        }
        to{
            transform:rotateY(360deg);
        }
    }
</style>
</head>
<body>

<div class="container">
    <div class="lantern" id="lantern">

        <span><img src="anh1.jpg"></span>
        <span><img src="anh2.jpg"></span>
        <span><img src="anh3.jpg"></span>
        <span><img src="anh44.jpg"></span>
        <span><img src="anh5.jpg"></span>
        <span><img src="anh6.jpg"></span>

    </div>
</div>

<script>
    const lantern = document.getElementById("lantern");

    lantern.addEventListener("mouseover", function(){
        lantern.style.animationPlayState = "paused";
    });

    lantern.addEventListener("mouseout", function(){
        lantern.style.animationPlayState = "running";
    });
</script>

</body>
</html>
